<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthenticityAI Guard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; max-height: 600px; overflow-y: auto;
      background: #020617; color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,.08); padding-bottom: 10px; }
    .logo-badge { background: linear-gradient(135deg,#3b82f6,#7c3aed); width: 32px; height: 32px;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,.4); }
    h2 { font-size: 1.05rem; font-weight: 800; }
    .status { display: flex; align-items: center; gap: 5px; font-size: .72rem; font-family: monospace; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .dot.online { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .dot.offline { background: #f87171; box-shadow: 0 0 8px #f87171; }
    .dot.checking { background: #fbbf24; }

    .card { background: rgba(15,23,42,.9); border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
    .label { font-size: .7rem; color: #94a3b8; font-weight: 600; margin-bottom: 3px; letter-spacing: .04em; }
    .page-url { font-size: .75rem; color: #60a5fa; word-break: break-all; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 11px; background: linear-gradient(135deg,#3b82f6,#7c3aed); color: #fff; border: none;
      border-radius: 10px; font-weight: 700; font-size: .9rem; cursor: pointer; text-decoration: none;
      box-shadow: 0 6px 20px rgba(59,130,246,.3); margin-top: 8px; }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn-secondary { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
      box-shadow: none; color: #cbd5e1; }
    .hint { font-size: .72rem; color: #94a3b8; margin-top: 8px; line-height: 1.4; }
    .error { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.35);
      color: #fecaca; border-radius: 10px; padding: 9px 11px; font-size: .78rem; margin-top: 10px; line-height: 1.4; }

    #summary { font-size: .78rem; color: #cbd5e1; margin: 12px 0 6px; font-weight: 600; }
    .row { display: flex; gap: 10px; background: rgba(15,23,42,.9); border: 1px solid rgba(255,255,255,.08);
      border-left-width: 4px; border-radius: 10px; padding: 8px; margin-bottom: 8px; }
    .row.ok { border-left-color: #34d399; } .row.warn { border-left-color: #fbbf24; }
    .row.bad { border-left-color: #f87171; } .row.neutral { border-left-color: #64748b; }
    .thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #0f172a; flex: none; }
    .body { min-width: 0; flex: 1; }
    .badge { display: inline-block; font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
    .ok .badge { background: rgba(52,211,153,.15); color: #6ee7b7; }
    .warn .badge { background: rgba(251,191,36,.15); color: #fcd34d; }
    .bad .badge { background: rgba(248,113,113,.15); color: #fca5a5; }
    .neutral .badge { background: rgba(148,163,184,.15); color: #cbd5e1; }
    .meta { font-size: .68rem; color: #94a3b8; margin-top: 3px; }
    .why { font-size: .74rem; color: #cbd5e1; margin-top: 4px; line-height: 1.35; }
    details { margin-top: 4px; font-size: .72rem; color: #94a3b8; }
    details summary { cursor: pointer; color: #60a5fa; }
    details ul { margin: 4px 0 0 16px; }
    .link-btn { background: none; border: none; color: #60a5fa; font-size: .72rem; cursor: pointer; margin-top: 4px; padding: 0; }

    .settings { margin-top: 10px; font-size: .75rem; color: #94a3b8; }
    .settings summary { cursor: pointer; }
    .settings label { display: block; margin-top: 8px; }
    .settings input[type=text] { width: 100%; margin-top: 3px; padding: 6px 8px; border-radius: 6px;
      background: #020617; color: #f8fafc; border: 1px solid rgba(255,255,255,.15); font-size: .75rem; }
    .settings .check { display: flex; gap: 6px; align-items: center; }
    .footer { text-align: center; font-size: .68rem; color: #64748b; margin-top: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">AI</div>
    <div>
      <h2>AuthenticityAI Guard</h2>
      <div class="status"><span id="status-dot" class="dot checking"></span><span id="status-text">Checking server…</span></div>
    </div>
  </div>

  <div class="card">
    <div class="label">CURRENT PAGE</div>
    <div class="page-url" id="current-url">Detecting tab…</div>
  </div>

  <button id="scan-page-btn" class="btn">🔍 Scan Images on This Page</button>
  <div class="hint" id="privacy-note"></div>
  <div id="error" class="error" hidden></div>

  <div id="summary" hidden></div>
  <div id="results"></div>

  <a id="open-web" href="#" target="_blank" rel="noopener" class="btn btn-secondary">🚀 Open Full Forensic Workbench</a>

  <details class="settings">
    <summary>⚙ Settings</summary>
    <label>Server (API) URL
      <input type="text" id="set-api" placeholder="http://localhost:8000">
    </label>
    <label>Web app URL
      <input type="text" id="set-web" placeholder="http://localhost:5173/analyze">
    </label>
    <label class="check"><input type="checkbox" id="set-auto"> Scan automatically when I open this popup (local server only)</label>
    <button id="save-settings" class="btn btn-secondary">Save</button>
    <div class="hint" id="settings-msg"></div>
  </details>

  <div class="footer">
    Results are probabilistic indicators, not proof.<br>
    Images are sent only to the server set above.
  </div>

  <script src="popup.js"></script>
</body>
</html>
